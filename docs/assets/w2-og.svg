<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">W2 — Know what your coding agent actually did.</title>
  <desc id="description">A technical preview card showing the W2 wordmark, headline, and task to diff to verify to receipt flow.</desc>
  <rect width="1200" height="630" fill="#101319"/>
  <rect x="58" y="54" width="1084" height="522" rx="18" fill="#151922" stroke="#303744" stroke-width="2"/>
