  <path d="M108 113h8l6 22 6-22h8l-10 29h-8l-10-29z" fill="#101319"/>
  <path d="M137 113h8v29h-8z" fill="#101319"/>
  <text x="168" y="137" fill="#e8edf3" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="650" letter-spacing="1">W2</text>
  <text x="96" y="252" fill="#f3f5f8" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-1.8">Know what your coding agent</text>
  <text x="96" y="324" fill="#f3f5f8" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-1.8">actually did.</text>
  <text x="98" y="372" fill="#aeb7c4" font-family="Segoe UI, Arial, sans-serif" font-size="23">Evidence-backed verification and run receipts for coding agents.</text>
  <line x1="98" y1="415" x2="1102" y2="415" stroke="#303744" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" letter-spacing="1.4" text-anchor="middle">
    <rect x="98" y="454" width="180" height="66" rx="9" fill="#1c222c" stroke="#46515f"/>
