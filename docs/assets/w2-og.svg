    <rect x="354" y="454" width="180" height="66" rx="9" fill="#1c222c" stroke="#46515f"/>
    <text x="444" y="496" fill="#e8edf3">DIFF</text>
    <text x="576" y="496" fill="#748394" font-size="24">→</text>
    <rect x="610" y="454" width="180" height="66" rx="9" fill="#1c222c" stroke="#46515f"/>
    <text x="700" y="496" fill="#e8edf3">VERIFY</text>
