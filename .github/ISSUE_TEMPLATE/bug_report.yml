name: Bug report
description: Report a reproducible W2 problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior without including private prompts, receipts, or secrets.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Steps, sanitized inputs, and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: W2 version and platform
      placeholder: 0.2.0-rc.1, Windows 11, Node 22
    validations:
      required: true
